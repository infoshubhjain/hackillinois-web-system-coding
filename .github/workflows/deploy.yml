name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Re-deploy daily so the bundled event snapshot stays fresh.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # The event API only sends CORS headers to localhost / hackillinois.org,
      # so the Pages build ships a snapshot the browser can fall back to.
      - name: Snapshot events
        run: curl -sf https://adonix.hackillinois.org/event/ -o public/events.json
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
